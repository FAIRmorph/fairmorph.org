
<svg xmlns="http://www.w3.org/2000/svg" width="1752" height="897" viewBox="0 0 1752 897" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">From scattered data work to guided, reusable curation</title>
<desc id="svgDesc">Comparison of a conventional ecological-data workflow involving Python or R programming, manual mapping and specialist curation, with FAIRmorph’s approach to guided ecological data curation, traceable original data and reusable outputs.</desc>
<defs>
  <linearGradient id="leftPanel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8f9fa"/><stop offset="1" stop-color="#f3f5f7"/></linearGradient>
  <linearGradient id="leftHead" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6ebef"/><stop offset="1" stop-color="#edf0f3"/></linearGradient>
  <linearGradient id="leftFooter" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8ecf1"/><stop offset="1" stop-color="#dfe5eb"/></linearGradient>
  <linearGradient id="rightPanel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fdfa"/><stop offset="1" stop-color="#eff9f2"/></linearGradient>
  <linearGradient id="rightHead" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e0f4e8"/><stop offset="1" stop-color="#eefbf2"/></linearGradient>
  <linearGradient id="curationCard" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9f7e8"/><stop offset="1" stop-color="#e3f6e6"/></linearGradient>
  <linearGradient id="rightFooter" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf9ed"/><stop offset="1" stop-color="#e8f6e8"/></linearGradient>
  <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="5" flood-color="#6b7e89" flood-opacity=".085"/></filter>
  <clipPath id="clipLeft"><rect x="22" y="140" width="823" height="725" rx="27"/></clipPath>
  <clipPath id="clipRight"><rect x="866" y="140" width="848" height="725" rx="27"/></clipPath>
</defs>
<style>
 text { font-family: Inter, "Inter Display", "Segoe UI", Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1752" height="897" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
<text x="876" y="52" font-size="43" font-weight="750" fill="#142338" text-anchor="middle" >From scattered data work to guided, reusable curation</text>
<text x="876" y="96" font-size="25" font-weight="420" fill="#4d6073" text-anchor="middle" >The same ecological data – two workflows with very different effort, transparency and reuse potential.</text>
<rect x="22" y="140" width="823" height="725" rx="27" fill="url(#leftPanel)" stroke="#dce3e9" stroke-width="1.6" />
<rect x="866" y="140" width="848" height="725" rx="27" fill="url(#rightPanel)" stroke="#74cfa0" stroke-width="2" />
<g clip-path="url(#clipLeft)">
<rect x="22" y="140" width="823" height="102" rx="0" fill="url(#leftHead)" stroke="none" stroke-width="1" />
<rect x="22" y="727" width="823" height="138" rx="0" fill="url(#leftFooter)" stroke="none" stroke-width="1" />
</g>
<g clip-path="url(#clipRight)">
<rect x="866" y="140" width="848" height="102" rx="0" fill="url(#rightHead)" stroke="none" stroke-width="1" />
<rect x="866" y="727" width="848" height="138" rx="0" fill="url(#rightFooter)" stroke="none" stroke-width="1" />
</g>
