<path d="M74 188 L104 204 L136 189 M74 188 L85 182 M136 189 L126 183" stroke="#334d5f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<path d="M74 202 L105 218 L136 203 L126 198 M74 202 L85 197" stroke="#334d5f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<text x="168" y="185" font-size="30" font-weight="750" fill="#152538" >Conventional workflow</text>
<text x="168" y="219" font-size="21.5" font-weight="400" fill="#1e3045" >Flexible, but often manual, fragmented and hard to reproduce.</text>
<path d="M920 217 C952 213 954 192 962 180 M941 206 C927 205 917 194 918 182 C934 180 944 191 941 206" stroke="#307a40" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<path d="M938 193 C933 175 946 163 970 164 C975 184 960 203 938 193 Z" stroke="#85ae63" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="#c5e4b0" />
<path d="M939 193 C947 183 954 178 964 173" stroke="#4c8840" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<text x="1007" y="185" font-size="30" font-weight="750" fill="#145434" >FAIRmorph’s approach</text>
<text x="1007" y="219" font-size="21.5" font-weight="400" fill="#203c35" >Structured, transparent and reusable – tailored to ecological data.</text>
<rect x="47" y="249" width="775" height="115" rx="18" fill="#ffffff" stroke="#e5ebef" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="47" y="401" width="775" height="148" rx="18" fill="#ffffff" stroke="#e5ebef" stroke-width="1.5" filter="url(#shadow)"/>
