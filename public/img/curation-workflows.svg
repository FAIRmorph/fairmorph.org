<path d="M1095 302v30m-10-10 10 10 10-10" fill="none" stroke="#11866b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="98" cy="407" r="28" fill="#edf0f4"/>
<text x="98" y="416" text-anchor="middle" class="num">02</text>
<circle cx="828" cy="407" r="28" fill="#e2f5ed"/>
<text x="828" y="416" text-anchor="middle" class="num numg">02</text>
<text x="143" y="403" class="step">Custom coding and mapping</text>
<text x="143" y="440" class="detail">Python / R programming</text>
<text x="143" y="477" class="detail">Manual configuration, field and unit mapping</text>
<text x="143" y="514" class="detail">Specialist data-curation knowledge</text>
<text x="873" y="403" class="step">Guided, ecology-aware review</text>
<text x="873" y="440" class="detail">Combine · Clean · Describe · Review</text>
<text x="873" y="477" class="detail">Field meanings and choices made explicit</text>
<text x="873" y="514" class="detail">Complete no-code guidance is planned</text>
<path d="M364 537v31m-10-10 10 10 10-10" fill="none" stroke="#788698" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1095 537v31m-10-10 10 10 10-10" fill="none" stroke="#11866b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="98" cy="644" r="28" fill="#edf0f4"/>
<text x="98" y="653" text-anchor="middle" class="num">03</text>
<circle cx="828" cy="644" r="28" fill="#e2f5ed"/>
<text x="828" y="653" text-anchor="middle" class="num numg">03</text>
<text x="143" y="636" class="step">Repeated cleanup and handovers</text>
<text x="143" y="675" class="detail">Rules scattered across scripts and notes</text>
<text x="143" y="711" class="detail">Harder for others to audit or reproduce</text>
<text x="873" y="636" class="step">Understandable, reusable data</text>
<text x="873" y="675" class="detail">Versioned decisions · Verifiable RUNs</text>
<text x="873" y="711" class="detail">Standards-based exports in development</text>
<text x="61" y="794" class="foot">Typical challenges, not universal requirements</text>
<text x="790" y="794" class="foot">Built on FOSS; scientific review stays explicit</text>
</svg>