<path d="M120 283 V298 H135" stroke="#354e5d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<rect x="95" y="309" width="33" height="16" rx="1" fill="none" stroke="#354e5d" stroke-width="2.8" />
<path d="M106 309 V325 M117 309 V325 M95 316 H128" stroke="#354e5d" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<text x="183" y="287" font-size="24" font-weight="750" fill="#152538" >Source data</text>
<text x="183" y="314" font-size="20.4" font-weight="400" fill="#243c4d" >Heterogeneous files (e.g. CSV, Excel, field sheets, sensor data)</text>
<text x="183" y="340" font-size="20.4" font-weight="400" fill="#243c4d" >with different formats, terms and levels of detail.</text>
<rect x="76" y="441" width="70" height="55" rx="7" fill="none" stroke="#354e5d" stroke-width="3.6" />
<path d="M84 449 H86 M94 449 H96 M94 469 L104 460 M94 469 L104 478 M126 460 L136 469 L126 478 M119 459 L112 479" stroke="#354e5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<text x="183" y="444" font-size="24" font-weight="750" fill="#152538" >Custom data work</text>
<text x="183" y="471" font-size="20.2" font-weight="400" fill="#243c4d" >Scripting in Python or R, manual configuration and mapping</text>
<text x="183" y="496" font-size="20.2" font-weight="400" fill="#243c4d" >(e.g. merging files, harmonising fields, unit and taxon handling),</text>
<text x="183" y="521" font-size="20.2" font-weight="400" fill="#243c4d" >often relying on specialist data curation know-how.</text>
<path d="M102 619 H125 L137 632 V669 M102 619 H125 L137 632" stroke="#354e5d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<path d="M92 625 H116 L130 640 V672 M116 625 V640 H130" stroke="#354e5d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<path d="M85 635 H109 L120 646 V676 H85 Z M109 635 V646 H120" stroke="#354e5d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<text x="183" y="631" font-size="22.8" font-weight="750" fill="#152538" >Repeated cleanup, documentation and handovers</text>
<text x="183" y="658" font-size="19.8" font-weight="400" fill="#243c4d" >Ad hoc decisions are documented in scripts, notebooks or notes,</text>
<text x="183" y="684" font-size="19.8" font-weight="400" fill="#243c4d" >which can be hard to interpret, maintain or reuse by others.</text>
<path d="M929 288 C929 276 974 276 974 288 V319 C974 333 929 333 929 319 Z" stroke="#137443" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<ellipse cx="951.5" cy="288" rx="22.5" ry="10" fill="#fff" stroke="#137443" stroke-width="3.6"/>
<path d="M929 303 C929 317 974 317 974 303" stroke="#137443" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<text x="1022" y="286" font-size="24" font-weight="750" fill="#16273b" >Original ecological data</text>
<text x="1022" y="315" font-size="20.5" font-weight="400" fill="#243b4a" >Your data, kept in their original form and fully traced</text>
<text x="1022" y="340" font-size="20.5" font-weight="400" fill="#243b4a" >(e.g. field observations, monitoring, sensor or survey data).</text>
<rect x="917" y="439" width="68" height="50" rx="5" fill="#ffffff" stroke="#147544" stroke-width="3.5" />
<path d="M911 489 H990 C989 495 982 496 975 496 H925 C919 496 911 494 911 489 Z" stroke="#729c58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#d6e6b4" />
<path d="M948 479 V463 M947 471 C937 469 938 462 940 458 C947 458 951 466 947 471" stroke="#4d8d4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<path d="M947 467 C954 467 965 463 963 451 C951 451 943 458 947 467" stroke="#4d8d4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#bfe0a0" />
<text x="1022" y="438" font-size="24" font-weight="750" fill="#16273b" >Guided, ecology-aware curation</text>
<text x="1022" y="465" font-size="20.5" font-weight="400" fill="#243b4a" >Interactive, step-by-step workflow with domain-specific questions,</text>
<text x="1022" y="490" font-size="20.5" font-weight="400" fill="#243b4a" >supported by built-in checks and clear documentation.</text>
<rect x="1019" y="509" width="159" height="44" rx="24" fill="#e4f6eb" stroke="#c6e9d7" stroke-width="1.6" filter="url(#shadow)"/>
<text x="1067" y="538" font-size="20" font-weight="720" fill="#17583a" >Combine</text>
<rect x="1194" y="509" width="130" height="44" rx="24" fill="#e4f6eb" stroke="#c6e9d7" stroke-width="1.6" filter="url(#shadow)"/>
<text x="1242" y="538" font-size="20" font-weight="720" fill="#17583a" >Clean</text>
<rect x="1339" y="509" width="163" height="44" rx="24" fill="#e4f6eb" stroke="#c6e9d7" stroke-width="1.6" filter="url(#shadow)"/>
<text x="1387" y="538" font-size="20" font-weight="720" fill="#17583a" >Describe</text>
<rect x="1517" y="509" width="151" height="44" rx="24" fill="#e4f6eb" stroke="#c6e9d7" stroke-width="1.6" filter="url(#shadow)"/>
<text x="1565" y="538" font-size="20" font-weight="720" fill="#17583a" >Review</text>
