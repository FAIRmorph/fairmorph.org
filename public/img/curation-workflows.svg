<path d="M923 641 L953 627 L979 641 L950 655 Z" stroke="#137443" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<path d="M924 655 L950 669 L979 655 M924 655 L934 650 M979 655 L970 650" stroke="#137443" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<path d="M924 669 L950 685 L979 669 M924 669 L934 665 M979 669 L970 665" stroke="#137443" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<text x="1022" y="638" font-size="24" font-weight="750" fill="#16273b" >Understandable, reusable data</text>
<text x="1022" y="667" font-size="19.1" font-weight="400" fill="#243b4a" >Transparent provenance · Repeatable updates · Standards-ready outputs</text>
<text x="1022" y="693" font-size="19.1" font-weight="400" fill="#243b4a" >(e.g. Darwin Core Archive for GBIF, structured packages for repositories).</text>
<circle cx="79" cy="771" r="21" fill="none" stroke="#435e72" stroke-width="3.5"/>
<path d="M79 759 V773 M79 782 V784" stroke="#435e72" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<circle cx="922" cy="771" r="21" fill="none" stroke="#7b9e55" stroke-width="3.5"/>
<path d="M910 770 L919 779 L934 763" stroke="#1b7541" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
<text x="122" y="765" font-size="19.3" fill="#17283b"><tspan font-weight="750">The challenge:</tspan><tspan font-weight="400"> Combining observations, resolving inconsistencies</tspan></text>
<text x="122" y="791" font-size="18.7" font-weight="400" fill="#17283b" >and explaining fields typically requires programming skills (Python or R),</text>
<text x="122" y="816" font-size="18.7" font-weight="400" fill="#17283b" >manual data configuration and domain expertise. When data are shared</text>
<text x="122" y="841" font-size="18.7" font-weight="400" fill="#17283b" >or updated, colleagues often have to reconstruct and re-validate the workflow.</text>
<text x="964" y="765" font-size="19.3" fill="#16462e"><tspan font-weight="750">The result:</tspan><tspan font-weight="400"> Step-by-step, domain-specific guidance helps researchers</tspan></text>
<text x="964" y="791" font-size="18.7" font-weight="400" fill="#16462e" >explain their data once, keep the decisions visible and produce well-documented,</text>
<text x="964" y="816" font-size="18.7" font-weight="400" fill="#16462e" >reusable data for sharing, publication and long-term use.</text>
</svg>
