  <rect x="45" y="344" width="640" height="186" rx="19" fill="white"/>
  <rect x="45" y="580" width="640" height="166" rx="19" fill="white"/>
  <rect x="775" y="157" width="640" height="139" rx="19" fill="white"/>
  <rect x="775" y="344" width="640" height="186" rx="19" fill="white"/>
  <rect x="775" y="580" width="640" height="166" rx="19" fill="white"/>
</g>
<circle cx="98" cy="214" r="28" fill="#edf0f4"/>
<text x="98" y="223" text-anchor="middle" class="num">01</text>
<circle cx="828" cy="214" r="28" fill="#e2f5ed"/>
<text x="828" y="223" text-anchor="middle" class="num numg">01</text>
<text x="143" y="209" class="step">Heterogeneous source data</text>
<text x="143" y="249" class="detail">CSV, Excel, field notes and sensor exports</text>
<text x="873" y="209" class="step">Original ecological data</text>
<text x="873" y="249" class="detail">Preserved unchanged with traceable identities</text>
