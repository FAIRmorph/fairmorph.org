name: Deploy FAIRmorph documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [code-updated, docs-updated]
  # Upstream repositories cannot use this repository's GITHUB_TOKEN.
  # Poll all three public upstream main branches: new documentation is
  # picked up automatically even if no cross-repo dispatch is configured.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fairmorph-docs-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout portal (legacy submodules not used)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Build site and fetch latest documentation from all repositories
        # prebuild -> prepare-docs -> sync-docs.js clones/fetches each upstream main
        run: npm run build

      - name: Record upstream source commits
        run: cat .docs-upstream/revisions.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
