name: Check FAIRmorph documentation integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portal without legacy pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portal with live upstream docs
        run: npm run build
      - name: Verify Engine documentation links resolve to published site routes
        run: |
          node - <<'JS'
          import fs from 'node:fs';
          const index = fs.readFileSync('src/content/docs/engine/docs/index.md', 'utf8');
          for (const url of [
            '/engine/install/',
            '/engine/docs/user-guide/',
            '/engine/docs/project-driven-run/',
            '/engine/docs/api-reference/',
            '/engine/docs/architecture/',
            '/engine/docs/data-contracts/',
            '/engine/docs/operations/',
            '/engine/docs/run-recovery/',
            '/engine/docs/scope-and-development/',
            '/engine/examples/cs-phoc/',
            '/engine/'
          ]) {
            if (!index.includes('](' + url + ')')) throw new Error('Missing transformed link in docs index: ' + url);
            const output = 'dist' + url + 'index.html';
            if (!fs.existsSync(output)) throw new Error('Unpublished documentation route: ' + url + ' (' + output + ')');
          }
          for (const url of ['/engine/install/', '/engine/docs/user-guide/']) {
            if (!fs.readFileSync('src/content/docs/engine/index.md', 'utf8').includes('](' + url + ')')) {
              throw new Error('README does not link into site: ' + url);
            }
          }
          JS
      - name: Verify other internal documentation links do not point to missing pages
        run: |
          node - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'src/content/docs';
          const pages = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (/\.mdx?$/.test(entry.name)) pages.push(p);
            }
          }
          walk(root);
          const missing = [];
          for (const file of pages) {
            const text = fs.readFileSync(file, 'utf8');
            for (const [, href] of text.matchAll(/\]\((\/[^)#]+)(?:#[^)]*)?\)/g)) {
              if (!href.startsWith('/engine/') && !href.startsWith('/workbench/') && !href.startsWith('/validations/') && !href.startsWith('/guide/')) continue;
              const output = 'dist' + (href.endsWith('/') ? href : href + '/') + 'index.html';
              if (!fs.existsSync(output)) missing.push(file + ': ' + href);
            }
          }
          if (missing.length) throw new Error('Missing documentation routes:\\n' + missing.join('\\n'));
          console.log('Verified internal links across ' + pages.length + ' Markdown pages');
          JS
      - name: Verify a single visible page heading and concise navigation
        run: |
          node - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const pages = [];
          function walk(directory) {
            for (const item of fs.readdirSync(directory, {withFileTypes: true})) {
              const file = path.join(directory, item.name);
              if (item.isDirectory()) walk(file);
              else if (item.name === 'index.html') pages.push(file);
            }
          }
          walk('dist');
          for (const file of pages) {
            const html = fs.readFileSync(file, 'utf8');
            const count = (html.match(/<h1[ >]/gi) || []).length;
            if (count !== 1) throw new Error(file + ' has ' + count + ' H1 elements (expected exactly one)');
          }
          for (const section of ['engine', 'workbench', 'validations']) {
            const page = fs.readFileSync('src/content/docs/' + section + '/index.md', 'utf8');
            if (!page.includes('title: "Overview"')) throw new Error('Repeated root title in ' + section);
          }
          const nav = fs.readFileSync('astro.config.mjs', 'utf8');
          for (const label of ['Project', 'Engine', 'Workbench', 'Validations']) {
            if (!nav.includes("label: '" + label + "'")) throw new Error('Missing navigation label ' + label);
          }
          console.log('Single H1 verified on ' + pages.length + ' published HTML pages');
          JS
      - name: Verify Prototype Fund warnings and research foundation
        run: |
          node - <<'JS'
          import fs from 'node:fs';
          for (const section of ['engine', 'workbench', 'validations']) {
            for (const name of ['index.md', 'INSTALL.md']) {
              const file = 'src/content/docs/' + section + '/' + name;
              // Imported installation guide source retains its original filename.
              if (!fs.existsSync(file)) throw new Error('Missing source documentation: ' + file);
              const doc = fs.readFileSync(file, 'utf8');
              if (!/Prototype Fund/.test(doc) || !/not production software/.test(doc)) throw new Error('Missing prototype warning: ' + file);
            }
          }
          for (const file of ['src/content/docs/index.mdx', 'src/content/docs/guide/overview.md']) {
            const doc = fs.readFileSync(file, 'utf8');
            if (!doc.includes('Prototype Fund') || !doc.includes('not production')) throw new Error('Missing public prototype notice: ' + file);
          }
          const homepage = fs.readFileSync('src/content/docs/index.mdx', 'utf8');
          if (!homepage.includes('Making ecological data FAIR') || !homepage.includes('guide/overview/')) throw new Error('Missing ecological FAIR hero/concept link');
          if (!homepage.includes("link: '#what-works-today'")) throw new Error('Second hero button must link to What works today');
          for (const phrase of ['Supporting researchers from field data to FAIR reuse', 'Bring ecological data together', 'Explain data through guided questions', 'Check and improve data with confidence', 'Make data easier for others to reuse', 'no-code interviews', 'already produces verified RUNs']) {
            if (!homepage.includes(phrase)) throw new Error('Missing researcher-focused benefit: ' + phrase);
          }
          for (const phrase of ['## What works today?', 'Prototype Fund', 'CS-PHOC', 'NSIS', 'AppImage', 'PyInstaller', 'CI/CD', 'Tauri desktop Workbench']) {
            if (!homepage.includes(phrase)) throw new Error('Missing Prototype Fund proof point: ' + phrase);
          }
          const concept = fs.readFileSync('src/content/docs/guide/overview.md', 'utf8');
          for (const doi of ['10.1016/j.ecoinf.2026.103712', '10.1371/journal.pbio.1002295', '10.1038/sdata.2016.18']) {
            if (!concept.includes(doi)) throw new Error('Missing research reference: ' + doi);
          }
          for (const section of ['engine', 'workbench', 'validations']) {
            const directory = 'src/content/docs/' + section;
            const walk = (dir) => fs.readdirSync(dir, {withFileTypes:true}).flatMap(e => e.isDirectory() ? walk(dir + '/' + e.name) : /[.]md$/.test(e.name) ? [dir + '/' + e.name] : []);
            for (const file of walk(directory)) {
              const doc = fs.readFileSync(file, 'utf8');
              if (/v0[.]13/i.test(doc)) throw new Error('Internal framework number leaked: ' + file);
            }
          }
          console.log('Prototype notice, cited evidence and public scope verified');
          JS
      - name: Check all three sources and navigation pages
        run: |
          node - <<'JS'
          import fs from 'node:fs';
          const revisions = JSON.parse(fs.readFileSync('.docs-upstream/revisions.json', 'utf8'));
          for (const id of ['engine', 'workbench', 'validations']) {
            if (!/^[0-9a-f]{40}$/.test(revisions[id]?.commit || '')) throw new Error('Missing upstream SHA: ' + id);
            if (revisions[id].pages < 2) throw new Error('No synced Markdown pages: ' + id);
            if (!fs.existsSync('src/content/docs/' + id + '/index.md')) throw new Error('Missing landing page: ' + id);
            console.log(id, revisions[id].pages, revisions[id].commit);
          }
          for (const f of ['src/content/docs/index.mdx', 'src/content/docs/guide/overview.md']) {
            if (!fs.existsSync(f)) throw new Error('Missing portal-owned page: ' + f);
          }
          const nav = fs.readFileSync('astro.config.mjs', 'utf8');
          for (const id of ['engine', 'workbench', 'validations']) {
            if (!nav.includes("directory: '" + id + "'")) throw new Error('No dynamic navigation for ' + id);
          }
          JS
